<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/app-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
  <title>Sem conexão | Clube da Navalha</title>
  <style>
    .offline{min-height:100svh;display:grid;place-items:center;padding:1.5rem;text-align:center}
    .offline-card{width:min(440px,100%);padding:2rem;border:1px solid var(--line);border-radius:28px;background:var(--surface)}
    .offline-icon{width:58px;height:58px;margin:0 auto 1.2rem;display:grid;place-items:center;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-size:1.7rem}
    .offline-card h1{font-size:1.7rem}
    .offline-card p{margin: .7rem 0 1.3rem;color:var(--muted)}
  </style>
</head>
<body>
  <main class="offline">
    <section class="offline-card">
      <div class="offline-icon" aria-hidden="true">⌁</div>
      <h1>Você está sem conexão</h1>
      <p>O Clube da Navalha abre como aplicativo, mas precisa de internet para carregar sua agenda e confirmar agendamentos.</p>
      <button class="btn btn-primary" type="button" onclick="location.reload()">Tentar novamente</button>
    </section>
  </main>
  <script src="/js/pwa.js"></script>
</body>
</html>
